services:
  - type: web
    name: pulse-social-app
    env: node
    plan: free
    buildCommand: npm install && cd client && npm install && npm run build
    startCommand: cd server && node server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: JWT_SECRET
        generateValue: true
      - key: CLIENT_URL
        value: https://social-media-feed-flame.vercel.app
